[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l3s-scientific-agent"
version = "0.1.0"
description = "Evidence-grounded research assistant for weather and renewable-energy science"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<2",
  "openai>=2,<3",
  "pydantic>=2,<3",
  "PyMuPDF>=1.24,<2",
  "sentence-transformers>=5,<6",
  "transformers>=4.48,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
