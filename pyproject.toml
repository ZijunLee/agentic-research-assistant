[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l3s-scientific-agent"
version = "0.1.0"
description = "Evidence-grounded research assistant for weather and renewable-energy science"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyMuPDF>=1.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
